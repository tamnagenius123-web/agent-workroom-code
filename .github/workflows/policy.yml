name: policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Head sha, not the merge commit. pull_request_target otherwise checks out the base branch.
      # The checker reads the PR body (env) and diffs base...head (three-dot),
      # which needs the merge-base commit reachable: the next step fetches
      # depth 1 first, then deepens until git can compute the merge-base
      # (verified locally: with the merge-base reachable, the verdict is
      # byte-identical to a full clone; without it the diff fails closed).
      # Nothing in this job runs a file from pr/.
      - name: checkout pull request for the diff
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: pr
      - name: fetch base commit and pull head
        working-directory: pr
        env:
          GIT_TERMINAL_PROMPT: "0"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          head_sha="${HEAD_SHA}"
          base_sha="${BASE_SHA}"
          # The checkout step authenticated its fetch, then dropped the token.
          # Fetch the two commits the checker reads: the base commit by sha
          # (GitHub serves reachable shas) and the advertised pull ref, which
          # is the ref fork commits are reachable from. If a fetch cannot
          # authenticate, keep going only when both commits are already local.
          if ! git fetch --no-tags --depth=1 origin \
            "+refs/pull/${PR_NUMBER}/head:refs/pull/${PR_NUMBER}/head" \
            "${base_sha}"
          then
            git cat-file -e "${head_sha}^{commit}"
            git cat-file -e "${base_sha}^{commit}"
          fi
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
          # Three-dot diff needs the merge-base reachable from both commits.
          # Deepen progressively; a long-diverged branch falls back to a full
          # fetch. If the merge-base still cannot be computed, fail here
          # rather than let the checker run on a degraded history.
          if ! git merge-base "${base_sha}" "${head_sha}" >/dev/null 2>&1; then
            for extra in 100 500; do
              git fetch --no-tags --deepen=${extra} origin "${head_sha}" "${base_sha}" || true
              git merge-base "${base_sha}" "${head_sha}" >/dev/null 2>&1 && break
            done
          fi
          if ! git merge-base "${base_sha}" "${head_sha}" >/dev/null 2>&1; then
            git fetch --no-tags --unshallow origin || git fetch --no-tags origin
          fi
          git merge-base "${base_sha}" "${head_sha}" >/dev/null
          git checkout --detach "${head_sha}"
          test "$(git rev-parse HEAD)" = "${head_sha}"
          git cat-file -e "${base_sha}^{commit}"
      - name: checkout base ref gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: gate
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: tier, decisions.tsv, blast radius
        working-directory: pr
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node "$GITHUB_WORKSPACE/gate/scripts/ci/check.mjs" "$BASE_SHA" "$HEAD_SHA"
