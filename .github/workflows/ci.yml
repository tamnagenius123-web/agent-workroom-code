name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# CI-HYGIENE: a workflow+ref group still drops a queued main run. Pull
# requests share one group per ref and cancel the older run. A push to
# main uses the commit sha, so a later push neither cancels it nor
# replaces one that is still queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TEST_CONCURRENCY: '4'
  TEST_FILE_TIMEOUT_MS: '300000'
jobs:
  # Classifies the diff. Heavy jobs read `product`. There is no workflow
  # paths filter: a skipped workflow would not report the required `pr` check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.filter.outputs.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GIT_TERMINAL_PROMPT: "0"
        run: node scripts/ci/changed-paths.mjs
  # `pr` is the required pull_request check. It runs on every pull request,
  # including a docs-only diff, so the check reports instead of sitting
  # skipped. A docs-only diff skips install, build, typecheck, lint, and
  # tests. Any other diff runs the affected set in this one job. It does
  # not run on a push to main. A main push runs `gate` and `test-shard`
  # when the push is a product change. Those names are not required checks.
  pr:
    if: always() && !cancelled() && github.event_name == 'pull_request'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: path filter must succeed
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: stale merge-gate wording lint (docs/OWNER_RULINGS.md)
        run: node scripts/ci/stale-phrases.mjs
      - name: migration number lint
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          ref="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags --depth=1 origin "+refs/heads/${ref}:refs/remotes/origin/${ref}"
          node scripts/ci/mig-num-lint.mjs "refs/remotes/origin/${ref}" HEAD
      - name: install
        if: needs.changes.outputs.product == 'true'
        run: npm ci
      - name: select affected tests
        if: needs.changes.outputs.product == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          mb="$(git merge-base "$base" HEAD)"
          git diff --name-only "$mb" HEAD > changed.txt
          node scripts/test-select.mjs --base "$base" --list > selected.txt 2> select.log
          cat select.log
          {
            echo "## test selection (D5-cl: affected set is the default)"
            echo "- changed files: $(wc -l < changed.txt)"
            echo "- selected test files: $(wc -l < selected.txt) of $(ls tests/*.test.ts | wc -l)"
            echo "- wide expansion (shared surface): $(grep -c 'WIDE' select.log || true) trigger(s)"
            echo ""
            echo "### changed"
            sed 's/^/- /' changed.txt
            echo ""
            echo "### selection log"
            sed 's/^/- /' select.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: build
        if: needs.changes.outputs.product == 'true'
        run: npm run build
      - name: tsbuildinfo cache
        if: needs.changes.outputs.product == 'true'
        uses: actions/cache@v4
        with:
          # The declaration outputs (.cache/tsc) must be cached together with
          # the buildinfo: buildinfo alone makes tsc -b trust outputs that are
          # not on disk and every referencing project fails TS6305 (proven on
          # run 41306059492; key bumped to start from a consistent cache).
          path: |
            .cache/tsbuildinfo
            .cache/tsc
          key: tsbuildinfo2-${{ runner.os }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}
          restore-keys: tsbuildinfo2-${{ runner.os }}-
      - name: typecheck
        if: needs.changes.outputs.product == 'true'
        run: npx tsc -b
      - name: eslint cache
        if: needs.changes.outputs.product == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}
          restore-keys: eslint-${{ runner.os }}-
      - name: lint
        if: needs.changes.outputs.product == 'true'
        run: npm run lint
      - name: run affected tests
        if: needs.changes.outputs.product == 'true'
        timeout-minutes: 15
        env:
          CLAUDE_AGENT_DIR: ${{ runner.temp }}/claude-agent
          WORKROOM_GW: ${{ runner.temp }}/grok-workroom
          CLAUDE_WT: ${{ runner.temp }}/claude-wt
        run: node scripts/test-select.mjs --base origin/${{ github.base_ref }}
  # Push to main is the integration point: static gates once, then the full
  # suite sharded across parallel jobs (D5-cl (3)). A docs-only push skips
  # both. The pull request job above is the only affected-set run.
  gate:
    if: github.event_name == 'push' && needs.changes.outputs.product == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: stale merge-gate wording lint (docs/OWNER_RULINGS.md)
        run: node scripts/ci/stale-phrases.mjs
      - name: migration number lint
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          ref="main"
          git fetch --no-tags --depth=1 origin "+refs/heads/${ref}:refs/remotes/origin/${ref}"
          node scripts/ci/mig-num-lint.mjs "refs/remotes/origin/${ref}" HEAD
      - run: npm ci
      - run: npm run build
      - name: tsbuildinfo cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/tsbuildinfo
            .cache/tsc
          key: tsbuildinfo2-${{ runner.os }}-${{ hashFiles('tsconfig*.json', 'package-lock.json') }}
          restore-keys: tsbuildinfo2-${{ runner.os }}-
      - run: npx tsc -b
      - name: eslint cache
        uses: actions/cache@v4
        with:
          path: .cache/eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}
          restore-keys: eslint-${{ runner.os }}-
      - run: npm run lint
  plan:
    if: github.event_name == 'push' && needs.changes.outputs.product == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: restore test timings
        uses: actions/cache/restore@v4
        with:
          path: .cache/test-timings.json
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      - name: plan shards
        id: plan
        run: node scripts/ci/plan-shards.mjs
  test-shard:
    if: github.event_name == 'push' && needs.changes.outputs.product == 'true'
    needs: [gate, plan, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: run shard ${{ matrix.shard }}
        timeout-minutes: 20
        env:
          CLAUDE_AGENT_DIR: ${{ runner.temp }}/claude-agent
          WORKROOM_GW: ${{ runner.temp }}/grok-workroom
          CLAUDE_WT: ${{ runner.temp }}/claude-wt
        run: node scripts/ci/run-files.mjs --files "${{ matrix.files }}"
      - name: upload shard timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: .cache/test-timings.json
          if-no-files-found: ignore
  timings:
    if: always() && !cancelled() && github.event_name == 'push' && needs.changes.outputs.product == 'true'
    needs: [test-shard, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: test-timings-*
          path: shard-timings
      - name: merge shard timings
        run: node scripts/ci/merge-timings.mjs shard-timings .cache/test-timings.json
      - name: save test timings
        if: hashFiles('.cache/test-timings.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/test-timings.json
          key: test-timings-${{ github.run_id }}
